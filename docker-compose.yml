name: dailytask

services:
  # -------------------------------------------------------------
  # 1. CENTRAL NGINX GATEWAY (Port 8080)
  # -------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: dailytask-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - frontend
    networks:
      - dailytask-network

  # -------------------------------------------------------------
  # 2. FRONTEND (React 19 + Vite SPA)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dailytask-frontend
    restart: always
    networks:
      - dailytask-network

  # -------------------------------------------------------------
  # 3. HTTP API GATEWAY (NestJS Port 3000 + Swagger)
  # -------------------------------------------------------------
  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    container_name: dailytask-api-gateway
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: "sqlserver://mssql:1433;database=DailyTaskDB;user=sa;password=P@ssw0rd;encrypt=true;trustServerCertificate=true;"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: "super-secret-dailytask-jwt-key-2026"
      JWT_EXPIRES_IN: "7d"
    depends_on:
      - mssql
      - redis
    networks:
      - dailytask-network

  # -------------------------------------------------------------
  # 4. MICROSERVICE: Auth & Users
  # -------------------------------------------------------------
  auth-user-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-user-service
    container_name: dailytask-auth-user-service
    restart: always
    environment:
      DATABASE_URL: "sqlserver://mssql:1433;database=DailyTaskDB;user=sa;password=P@ssw0rd;encrypt=true;trustServerCertificate=true;"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: "super-secret-dailytask-jwt-key-2026"
    depends_on:
      - mssql
      - redis
    networks:
      - dailytask-network

  # -------------------------------------------------------------
  # 5. MICROSERVICE: Task Management
  # -------------------------------------------------------------
  task-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: task-service
    container_name: dailytask-task-service
    restart: always
    environment:
      DATABASE_URL: "sqlserver://mssql:1433;database=DailyTaskDB;user=sa;password=P@ssw0rd;encrypt=true;trustServerCertificate=true;"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mssql
      - redis
    networks:
      - dailytask-network

  # -------------------------------------------------------------
  # 6. MICROSERVICE: Dashboard Analytics & Trends
  # -------------------------------------------------------------
  dashboard-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: dashboard-service
    container_name: dailytask-dashboard-service
    restart: always
    environment:
      DATABASE_URL: "sqlserver://mssql:1433;database=DailyTaskDB;user=sa;password=P@ssw0rd;encrypt=true;trustServerCertificate=true;"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mssql
      - redis
    networks:
      - dailytask-network

  # -------------------------------------------------------------
  # 7. MESSAGE BROKER & CACHE: Redis 7
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: dailytask-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dailytask-network

  # -------------------------------------------------------------
  # 8. DATABASE: Microsoft SQL Server 2022
  # -------------------------------------------------------------
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dailytask-mssql
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "P@ssw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - dailytask-network

# -------------------------------------------------------------
# VOLUMES & NETWORKS
# -------------------------------------------------------------
volumes:
  mssql_data:
  redis_data:

networks:
  dailytask-network:
    driver: bridge
